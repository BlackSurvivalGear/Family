<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Events Calendar | Lawal.org Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4AF37', hover: '#be992e', light: '#fdfbf2' },
            emerald: { DEFAULT: '#10B981', hover: '#059669' },
            slate: { 950: '#0B0F17' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 selection:bg-gold/30 selection:text-gold flex min-h-screen">

  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Layout wrapper -->
  <div class="flex-grow flex flex-col min-w-0 lg:pl-64">
    <!-- Shared Header Container -->
    <div id="header-container"></div>

    <!-- Main Workspace events workspace -->
    <main class="flex-grow p-6 md:p-8 flex flex-col gap-8 max-w-7xl mx-auto w-full">

      <!-- Headline banner -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-white/5 pb-4">
        <div class="flex flex-col gap-1">
          <h1 class="font-serif text-2xl md:text-3xl font-bold text-white tracking-wide">Family Events Calendar</h1>
          <p class="text-xs text-slate-400 font-light">Keep up with global family gatherings, reunions, birthdays, and anniversaries.</p>
        </div>
        <!-- Create event trigger button -->
        <button id="add-event-trigger-btn" class="px-4 h-8 bg-gold hover:bg-gold-hover text-slate-950 font-bold tracking-wider text-[10px] uppercase rounded-lg flex items-center gap-1.5 transition-all">
          <i class="fa-solid fa-calendar-plus"></i> Create Event
        </button>
      </div>

      <!-- INTERACTIVE MONTHLY CALENDAR GRID -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

        <!-- Interactive Monthly Calendar View (8 cols) -->
        <div class="lg:col-span-8 flex flex-col gap-4">
          <div class="glass-panel border border-white/5 rounded-3xl p-5 shadow-xl flex flex-col gap-5">

            <!-- Calendar Navigation Header -->
            <div class="flex items-center justify-between">
              <h2 class="font-serif text-base font-bold text-white tracking-wide" id="calendar-month-year">November 2024</h2>
              <div class="flex items-center gap-1.5">
                <button id="prev-month-btn" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-colors">
                  <i class="fa-solid fa-chevron-left text-xs"></i>
                </button>
                <button id="today-btn" class="px-3 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-xs font-semibold text-slate-300 hover:text-white transition-colors">
                  Today
                </button>
                <button id="next-month-btn" class="w-8 h-8 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition-colors">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
              </div>
            </div>

            <!-- Days of Week labels -->
            <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] uppercase font-bold tracking-wider text-slate-500">
              <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
            </div>

            <!-- Days Grid -->
            <div class="grid grid-cols-7 gap-1.5" id="calendar-days-grid">
              <!-- Dynamically populated via JS -->
            </div>

          </div>
        </div>

        <!-- Sidebar Agenda List Panel (4 cols) -->
        <div class="lg:col-span-4 flex flex-col gap-4">
          <div class="glass-panel border border-white/5 rounded-3xl p-5 shadow-xl flex flex-col gap-4">
            <h3 class="font-serif text-sm font-bold text-white uppercase tracking-wider border-b border-white/5 pb-2">Upcoming Agenda List</h3>

            <!-- Agenda content -->
            <div class="flex flex-col gap-3.5 max-h-[400px] overflow-y-auto" id="agenda-list">
              <!-- Populated via JS -->
            </div>
          </div>
        </div>

      </div>

    </main>
  </div>

  <!-- Reusable navigation launcher modules -->
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/events.js"></script>
</body>
</html>
