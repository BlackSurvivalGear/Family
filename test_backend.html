<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>House of Lawal Backend Architecture & Service Tests</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #F3F4F6;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    h1 { color: #F59E0B; }
    h2 { color: #10B981; border-bottom: 1px solid #374151; padding-bottom: 6px; margin-top: 30px; }
    .test-case {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 5px solid;
    }
    .pass {
      background: #064E3B;
      border-color: #10B981;
    }
    .fail {
      background: #7F1D1D;
      border-color: #EF4444;
    }
    #summary {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Backend Architecture & Services Test Suite</h1>
  <div id="summary">Running tests...</div>
  <div id="results"></div>

  <script type="module">
    import { validateMember, detectDuplicateMember } from "./js/validators/memberValidator.js";
    import { validateRelationship, detectCircularAncestry, RELATIONSHIP_TYPES } from "./js/validators/relationshipValidator.js";
    import * as familyRepo from "./js/repositories/familyRepository.js";
    import * as relRepo from "./js/repositories/relationshipRepository.js";
    import * as auditRepo from "./js/repositories/auditLogRepository.js";
    import * as branchRepo from "./js/repositories/branchRepository.js";
    import * as timelineRepo from "./js/repositories/timelineRepository.js";
    import * as mediaRepo from "./js/repositories/mediaRepository.js";
    import * as docRepo from "./js/repositories/documentRepository.js";
    import * as engine from "./js/genealogy/relationshipEngine.js";

    // Service imports
    import * as memberService from "./js/services/memberService.js";
    import * as relationshipService from "./js/services/relationshipService.js";
    import * as branchService from "./js/services/branchService.js";
    import * as timelineService from "./js/services/timelineService.js";
    import * as mediaService from "./js/services/mediaService.js";
    import * as documentService from "./js/services/documentService.js";
    import { subscribe } from "./js/services/eventBus.js";
    import { ROLES } from "./js/firebase/permissions.js";

    const resultsDiv = document.getElementById("results");
    const summaryDiv = document.getElementById("summary");

    let totalTests = 0;
    let passedTests = 0;

    function assert(condition, message) {
      totalTests++;
      const div = document.createElement("div");
      div.className = "test-case " + (condition ? "pass" : "fail");
      div.textContent = (condition ? "✓ PASS: " : "✗ FAIL: ") + message;
      resultsDiv.appendChild(div);
      if (condition) passedTests++;
    }

    async function runTests() {
      // Clear storage to isolate tests
      localStorage.clear();

      try {
        // =====================================================================
        // 1. MEMBER VALIDATOR TESTS
        // =====================================================================
        console.log("Running Member Validator Tests...");

        const validMember = {
          firstName: "Lateef",
          lastName: "Lawal",
          gender: "Male",
          birthDate: "1990-01-01",
          living: true
        };
        const res1 = validateMember(validMember);
        assert(res1.isValid, "Valid member should pass validation.");

        const invalidMember1 = { lastName: "Lawal", gender: "Male" };
        assert(!validateMember(invalidMember1).isValid, "Member without first name should fail validation.");

        const invalidMember2 = { firstName: "A", lastName: "B", gender: "Robot" };
        assert(!validateMember(invalidMember2).isValid, "Member with invalid gender should fail validation.");

        const invalidMember3 = {
          firstName: "A",
          lastName: "B",
          gender: "Male",
          birthDate: "2020-01-01",
          deathDate: "2010-01-01",
          living: false
        };
        assert(!validateMember(invalidMember3).isValid, "Birth date after death date should fail validation.");

        const invalidMember4 = {
          firstName: "A",
          lastName: "B",
          gender: "Male",
          birthDate: "2000-01-01",
          deathDate: "2020-01-01",
          living: true
        };
        assert(!validateMember(invalidMember4).isValid, "Living member cannot have death date.");

        const list = [
          { firstName: "Lateef", lastName: "Lawal", birthDate: "1990-01-01", memberId: "m1" }
        ];
        const dupMatch = detectDuplicateMember({ firstName: "Lateef", lastName: "Lawal", birthDate: "1990-01-01" }, list);
        assert(dupMatch !== null && dupMatch.memberId === "m1", "Duplicate member correctly detected.");

        // =====================================================================
        // 2. RELATIONSHIP VALIDATOR TESTS
        // =====================================================================
        console.log("Running Relationship Validator Tests...");

        const validRel = {
          personA: "p1",
          personB: "p2",
          relationshipType: RELATIONSHIP_TYPES.SPOUSE
        };
        assert(validateRelationship(validRel).isValid, "Valid relationship should pass validation.");

        const selfRel = {
          personA: "p1",
          personB: "p1",
          relationshipType: RELATIONSHIP_TYPES.SPOUSE
        };
        assert(!validateRelationship(selfRel).isValid, "Self-relationship is invalid.");

        const badTypeRel = {
          personA: "p1",
          personB: "p2",
          relationshipType: "BEST_FRIEND"
        };
        assert(!validateRelationship(badTypeRel).isValid, "Invalid relationship type should fail validation.");

        const badDatesRel = {
          personA: "p1",
          personB: "p2",
          relationshipType: RELATIONSHIP_TYPES.SPOUSE,
          startDate: "2020-01-01",
          endDate: "2010-01-01"
        };
        assert(!validateRelationship(badDatesRel).isValid, "Start date after end date should fail validation.");

        const currentRels = [
          { personA: "A", personB: "B", relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER },
          { personA: "B", personB: "C", relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_MOTHER }
        ];
        assert(detectCircularAncestry("A", "C", currentRels), "Circular ancestry loop detected correctly.");
        assert(!detectCircularAncestry("A", "D", currentRels), "Non-circular ancestry checks out.");

        // =====================================================================
        // 3. REPOSITORY CRUD & AUDIT TESTS
        // =====================================================================
        console.log("Running Repository CRUD Tests...");

        const createdMemId = await familyRepo.create({
          firstName: "Alhaji",
          lastName: "Tester",
          gender: "Male",
          living: true
        });
        assert(typeof createdMemId === "string", "familyRepo.create returns string ID.");

        const retrievedMem = await familyRepo.findById(createdMemId);
        assert(retrievedMem !== null && retrievedMem.lastName === "Tester", "familyRepo.findById retrieves correct member.");

        await familyRepo.update(createdMemId, { firstName: "Chief" });
        const updatedMem = await familyRepo.findById(createdMemId);
        assert(updatedMem.firstName === "Chief", "familyRepo.update changes fields correctly.");

        await familyRepo.deleteMember(createdMemId);
        const deletedMem = await familyRepo.findById(createdMemId);
        assert(deletedMem === null, "familyRepo.deleteMember soft deletes member.");

        const logs = await auditRepo.findAll();
        assert(logs.length >= 3, "Audit logs automatically recorded write operations.");
        assert(logs[0].action === "DELETE" && logs[0].collection === "familyMembers", "Soft-delete is logged correctly.");

        const branchId = await branchRepo.create({ name: "Abuja Branch", region: "Northern Nigeria" });
        const foundBranch = await branchRepo.findById(branchId);
        assert(foundBranch !== null && foundBranch.region === "Northern Nigeria", "branchRepo creates and finds branch.");

        const timelineId = await timelineRepo.create({ year: "1960", title: "Independence", description: "Nigeria gained independence" });
        const foundTime = await timelineRepo.findById(timelineId);
        assert(foundTime !== null && foundTime.year === "1960", "timelineRepo works correctly.");

        const docId = await docRepo.create({ title: "Birth Cert", fileUrl: "http://example.com/file.pdf" });
        const foundDoc = await docRepo.findById(docId);
        assert(foundDoc !== null && foundDoc.title === "Birth Cert", "documentRepo works correctly.");

        const mediaId = await mediaRepo.create({ url: "http://example.com/pic.jpg", caption: "Old family house" });
        const foundMedia = await mediaRepo.findById(mediaId);
        assert(foundMedia !== null && foundMedia.url === "http://example.com/pic.jpg", "mediaRepo works correctly.");

        await relRepo.create({ personA: "ParentX", personB: "ChildY", relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        let threwCycleError = false;
        try {
          await relRepo.create({ personA: "ChildY", personB: "ParentX", relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        } catch (e) {
          threwCycleError = true;
        }
        assert(threwCycleError, "relationshipRepo.create rejects circular parent-child loop.");

        // =====================================================================
        // 4. RELATIONSHIP ENGINE TESTS
        // =====================================================================
        console.log("Running Relationship Engine Tests...");
        localStorage.clear();

        const husbandId = await familyRepo.create({ firstName: "Adeleke", lastName: "Lawal", gender: "Male", living: true });
        const wifeId = await familyRepo.create({ firstName: "Kemi", lastName: "Lawal", gender: "Female", living: true });
        await relRepo.create({ personA: husbandId, personB: wifeId, relationshipType: RELATIONSHIP_TYPES.SPOUSE, status: "Current" });

        const currentSpouses = await engine.getCurrentSpouses(husbandId);
        assert(currentSpouses.length === 1 && currentSpouses[0].firstName === "Kemi", "getCurrentSpouses retrieves correct current spouse.");

        const relHusbandWife = await engine.findRelationship(husbandId, wifeId);
        assert(relHusbandWife === "Current Spouse", "findRelationship correctly classifies Current Spouse.");

        const exWifeId = await familyRepo.create({ firstName: "Fatima", lastName: "Bello", gender: "Female", living: true });
        await relRepo.create({ personA: husbandId, personB: exWifeId, relationshipType: RELATIONSHIP_TYPES.FORMER_SPOUSE, status: "Past" });

        const formerSpouses = await engine.getFormerSpouses(husbandId);
        assert(formerSpouses.length === 1 && formerSpouses[0].firstName === "Fatima", "getFormerSpouses retrieves correct former spouse.");

        const allSpouses = await engine.getSpouses(husbandId);
        assert(allSpouses.length === 2, "getSpouses retrieves all spouses (current and former).");

        const sonOfHusbandId = await familyRepo.create({ firstName: "Tunde", lastName: "Lawal", gender: "Male", living: true });
        const daughterOfWifeId = await familyRepo.create({ firstName: "Funmi", lastName: "Adele", gender: "Female", living: true });

        await relRepo.create({ personA: husbandId, personB: sonOfHusbandId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: wifeId, personB: daughterOfWifeId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_MOTHER });
        await relRepo.create({ personA: wifeId, personB: sonOfHusbandId, relationshipType: RELATIONSHIP_TYPES.STEP_PARENT });
        await relRepo.create({ personA: husbandId, personB: daughterOfWifeId, relationshipType: RELATIONSHIP_TYPES.STEP_PARENT });

        const stepChildrenHusband = await engine.getStepChildren(husbandId);
        assert(stepChildrenHusband.length === 1 && stepChildrenHusband[0].firstName === "Funmi", "getStepChildren retrieves step children.");

        const relSonDaughter = await engine.findRelationship(sonOfHusbandId, daughterOfWifeId);
        assert(relSonDaughter === "Step Brother", "findRelationship correctly identifies Step Brother.");

        const sharedChildId = await familyRepo.create({ firstName: "Damilola", lastName: "Lawal", gender: "Male", living: true });
        await relRepo.create({ personA: husbandId, personB: sharedChildId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: wifeId, personB: sharedChildId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_MOTHER });

        const sharedHalfSiblings = await engine.getHalfSiblings(sharedChildId);
        assert(sharedHalfSiblings.length === 2, "getHalfSiblings retrieves correct half siblings.");

        const adoptiveDadId = await familyRepo.create({ firstName: "Yusuf", lastName: "Lawal", gender: "Male", living: true });
        const adoptedChildId = await familyRepo.create({ firstName: "Bola", lastName: "Lawal", gender: "Female", living: true });
        await relRepo.create({ personA: adoptiveDadId, personB: adoptedChildId, relationshipType: RELATIONSHIP_TYPES.ADOPTIVE_PARENT });

        const adoptedChildren = await engine.getAdoptedChildren(adoptiveDadId);
        assert(adoptedChildren.length === 1 && adoptedChildren[0].firstName === "Bola", "getAdoptedChildren retrieves adopted child.");

        // Deep Ancestry & Cousins
        const gGrandfatherId = await familyRepo.create({ firstName: "Alhaji-I", lastName: "Lawal", gender: "Male", living: false });
        const grandfatherId = await familyRepo.create({ firstName: "Alhaji-II", lastName: "Lawal", gender: "Male", living: false });
        const fatherId = await familyRepo.create({ firstName: "Kolawole", lastName: "Lawal", gender: "Male", living: true });
        const childId = await familyRepo.create({ firstName: "Segun", lastName: "Lawal", gender: "Male", living: true });
        const uncleId = await familyRepo.create({ firstName: "Taiwo", lastName: "Lawal", gender: "Male", living: true });
        const firstCousinId = await familyRepo.create({ firstName: "Kehinde", lastName: "Lawal", gender: "Male", living: true });
        const cousinOnceRemovedId = await familyRepo.create({ firstName: "Idowu", lastName: "Lawal", gender: "Female", living: true });

        await relRepo.create({ personA: gGrandfatherId, personB: grandfatherId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: grandfatherId, personB: fatherId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: fatherId, personB: childId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: grandfatherId, personB: uncleId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: uncleId, personB: firstCousinId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });
        await relRepo.create({ personA: firstCousinId, personB: cousinOnceRemovedId, relationshipType: RELATIONSHIP_TYPES.BIOLOGICAL_FATHER });

        const genGGrandfather = await engine.getGeneration(gGrandfatherId);
        assert(genGGrandfather === 1, "getGeneration calculates Alhaji-I as Gen 1.");

        const isAnc = await engine.isAncestor(gGrandfatherId, childId);
        assert(isAnc === true, "isAncestor deep ancestry verified.");

        const relCousin = await engine.findRelationship(firstCousinId, childId);
        assert(relCousin === "First Cousin", "findRelationship correctly identifies First Cousin.");

        // =====================================================================
        // 5. SERVICE LAYER & INTEGRATION TESTS
        // =====================================================================
        console.log("Running Service Layer & Integration Tests...");
        localStorage.clear();

        // Setup simulated user session
        const adminUser = { uid: "admin-123", email: "admin@lawal.org", role: "SUPER_ADMIN" };
        localStorage.setItem("lawal_current_user", JSON.stringify(adminUser));

        // Event Bus subscription verification
        let creationEventTriggered = false;
        let createdPayload = null;
        subscribe("memberCreated", (data) => {
          creationEventTriggered = true;
          createdPayload = data;
        });

        // 5.1 Member Service Tests
        const newMemberId = await memberService.createMember({
          firstName: "Babatunde",
          lastName: "Lawal",
          gender: "Male",
          birthDate: "1985-05-15",
          living: true,
          branchId: "Lagos"
        });
        assert(newMemberId !== null, "memberService.createMember creates and returns ID.");
        assert(creationEventTriggered, "Event Bus 'memberCreated' successfully published.");
        assert(createdPayload && createdPayload.firstName === "Babatunde", "Event Bus published payload verified.");

        // Update Member
        const updateSuccess = await memberService.updateMember(newMemberId, { preferredName: "Baba-T" });
        assert(updateSuccess, "memberService.updateMember updates member successfully.");
        const updatedFetched = await memberService.getMember(newMemberId);
        assert(updatedFetched.preferredName === "Baba-T", "Member update is persisted correctly.");

        // Soft Delete Member
        const deleteSuccess = await memberService.softDeleteMember(newMemberId);
        assert(deleteSuccess, "memberService.softDeleteMember soft deletes member.");
        const softDeletedCheck = await memberService.getMember(newMemberId);
        assert(softDeletedCheck === null, "Soft deleted member ignored by default in queries.");

        // Restore Member
        const restoreSuccess = await memberService.restoreMember(newMemberId);
        assert(restoreSuccess, "memberService.restoreMember restores member.");
        const restoredCheck = await memberService.getMember(newMemberId);
        assert(restoredCheck !== null && restoredCheck.deleted === false, "Restored member active and accessible again.");

        // Archive Member
        const archiveSuccess = await memberService.archiveMember(newMemberId);
        assert(archiveSuccess, "memberService.archiveMember archives member.");
        const archivedCheck = await memberService.getMember(newMemberId, true);
        assert(archivedCheck.archived === true && archivedCheck.status === "Archived", "Member successfully archived.");

        // Restore back to active and remove archived to normalize for sibling/spouse tests
        await memberService.updateMember(newMemberId, { archived: false, status: "Living" });

        // Search Members
        const searchResults = await memberService.searchMembers({ firstName: "Babatunde" });
        assert(searchResults.length === 1 && searchResults[0].memberId === newMemberId, "memberService.searchMembers finds member correctly.");

        // Member Exists
        const exists = await memberService.memberExists(newMemberId);
        assert(exists === true, "memberService.memberExists returns true for existing member.");

        // 5.2 Relationship Service Tests
        const fatherId_s = await memberService.createMember({ firstName: "Adekunle", lastName: "Lawal", gender: "Male", birthDate: "1955-06-10", living: true });
        const motherId_s = await memberService.createMember({ firstName: "Abimbola", lastName: "Lawal", gender: "Female", birthDate: "1960-08-12", living: true });
        const childId_s = await memberService.createMember({ firstName: "Kayode", lastName: "Lawal", gender: "Male", birthDate: "1990-11-20", living: true });

        // Add Mother & Father
        const fRelId = await relationshipService.addFather(childId_s, fatherId_s);
        const mRelId = await relationshipService.addMother(childId_s, motherId_s);
        assert(typeof fRelId === "string" && typeof mRelId === "string", "relationshipService addFather and addMother successfully created.");

        // Add Sibling
        const siblingId_s = await memberService.createMember({ firstName: "Damilare", lastName: "Lawal", gender: "Male", birthDate: "1992-04-05", living: true });
        const sibRelId = await relationshipService.addSibling(childId_s, siblingId_s);
        assert(typeof sibRelId === "string", "relationshipService.addSibling successfully created Sibling relationship.");

        // Add Child
        const grandsonId_s = await memberService.createMember({ firstName: "Dapo", lastName: "Lawal", gender: "Male", birthDate: "2015-01-10", living: true });
        const childRelId = await relationshipService.addChild(childId_s, grandsonId_s);
        assert(typeof childRelId === "string", "relationshipService.addChild successfully created Child relationship.");

        // Multiple spouses and former spouse transition (Transactions test)
        const wife1_Id = await memberService.createMember({ firstName: "Shola", lastName: "Lawal", gender: "Female", birthDate: "1988-12-01", living: true });
        const wife2_Id = await memberService.createMember({ firstName: "Nike", lastName: "Lawal", gender: "Female", birthDate: "1991-03-15", living: true });

        // Add first spouse (Current)
        const spouse1RelId = await relationshipService.addSpouse(childId_s, wife1_Id);
        const firstSpouses = await engine.getCurrentSpouses(childId_s);
        assert(firstSpouses.length === 1 && firstSpouses[0].firstName === "Shola", "First spouse added and verified as current.");

        // Add second spouse (triggers transaction/local sequential transition)
        const spouse2RelId = await relationshipService.addSpouse(childId_s, wife2_Id);
        const secondSpouses = await engine.getCurrentSpouses(childId_s);
        assert(secondSpouses.length === 1 && secondSpouses[0].firstName === "Nike", "Second spouse added and is now current.");

        const prevSpouseRel = await relRepo.findById(spouse1RelId);
        assert(prevSpouseRel.status === "Past" && prevSpouseRel.relationshipType === "FORMER_SPOUSE", "Previous spouse successfully transitioned to FORMER_SPOUSE.");

        // 5.3 Adoptive Parent & Step Parent
        const adoptiveParentId = await memberService.createMember({ firstName: "Lanre", lastName: "Lawal", gender: "Male", birthDate: "1970-10-10", living: true });
        const adoptedChildId_s = await memberService.createMember({ firstName: "Yomi", lastName: "Lawal", gender: "Male", birthDate: "2000-01-01", living: true });
        const adoptRelId = await relationshipService.addAdoptiveParent(adoptedChildId_s, adoptiveParentId);
        assert(typeof adoptRelId === "string", "relationshipService.addAdoptiveParent created successfully.");

        // 5.4 Validation Failures & Errors
        let threwCircular = false;
        try {
          // Attempting to make Kayode a father of his father Adekunle
          await relationshipService.addFather(fatherId_s, childId_s);
        } catch (e) {
          threwCircular = e.name === "CircularRelationship" || e.name === "CircularAncestry";
        }
        assert(threwCircular, "Relationship service rejects circular ancestry with CircularRelationship error.");

        let threwDuplicateParent = false;
        try {
          // Attempting to add another biological father to Kayode
          const anotherFatherId = await memberService.createMember({ firstName: "Segun", lastName: "Bello", gender: "Male", birthDate: "1950-01-01", living: true });
          await relationshipService.addFather(childId_s, anotherFatherId);
        } catch (e) {
          threwDuplicateParent = e.name === "RelationshipConflict";
        }
        assert(threwDuplicateParent, "Relationship service rejects duplicate biological father with RelationshipConflict.");

        // 5.5 Permissions Checks
        // Set simulated user to general MEMBER
        localStorage.setItem("lawal_current_user", JSON.stringify({ uid: "member-345", email: "member@lawal.org", role: ROLES.MEMBER }));

        let threwPermissionOnOther = false;
        try {
          // Member attempting to update someone else's profile
          await memberService.updateMember(fatherId_s, { preferredName: "Boss" });
        } catch (e) {
          threwPermissionOnOther = e.name === "PermissionDenied";
        }
        assert(threwPermissionOnOther, "General MEMBER denied editing other profiles.");

        let allowedOnSelf = false;
        try {
          // Member editing own profile
          localStorage.setItem("lawal_current_user", JSON.stringify({ uid: fatherId_s, email: "father@lawal.org", role: ROLES.MEMBER }));
          allowedOnSelf = await memberService.updateMember(fatherId_s, { preferredName: "Papa" });
        } catch (e) {
          allowedOnSelf = false;
        }
        assert(allowedOnSelf, "General MEMBER successfully allowed to edit their own profile.");

        // Reset to Admin for cleanup
        localStorage.setItem("lawal_current_user", JSON.stringify(adminUser));

        // 5.6 Branch, Timeline, Media, and Document Service Tests
        const serviceBranchId = await branchService.createBranch({ name: "Port Harcourt Branch", region: "Southern Niger Delta" });
        assert(typeof serviceBranchId === "string", "branchService.createBranch successfully wraps branchRepo.");

        const serviceTimelineId = await timelineService.createTimelineRecord({ year: "1999", title: "Democratic Third Republic", description: "Inauguration of civil governance" });
        assert(typeof serviceTimelineId === "string", "timelineService.createTimelineRecord successfully wraps timelineRepo.");

        const serviceMediaId = await mediaService.createMedia({ url: "http://example.com/festac.jpg", caption: "Festac '77 Family Reunion" });
        assert(typeof serviceMediaId === "string", "mediaService.createMedia successfully wraps mediaRepo.");

        const serviceDocId = await documentService.createDocument({ title: "Grandfather Certificate", fileUrl: "http://example.com/certificate.pdf" });
        assert(typeof serviceDocId === "string", "documentService.createDocument successfully wraps documentRepo.");

      } catch (err) {
        console.error("Test execution threw error:", err);
        assert(false, "Test execution threw error: " + err.message);
      }

      // Update summary banner
      const isSuccess = passedTests === totalTests;
      summaryDiv.textContent = `${passedTests} / ${totalTests} tests passed. State: ` + (isSuccess ? "SUCCESS" : "FAILURE");
      summaryDiv.style.background = isSuccess ? "#047857" : "#B91C1C";

      // Inject test status for automation tracking
      const indicator = document.createElement("div");
      indicator.id = "test-status-indicator";
      indicator.dataset.status = isSuccess ? "SUCCESS" : "FAILURE";
      document.body.appendChild(indicator);
    }

    runTests();
  </script>
</body>
</html>
