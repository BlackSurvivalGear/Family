<!DOCTYPE html>

<head>

  <!-- Tailwind CSS CDN -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4AF37', hover: '#be992e' },
            emerald: { DEFAULT: '#10B981', hover: '#059669' },
            slate: { 950: '#0B0F17' }
          }
        }
      }
    }
  </script>

<body class="bg-slate-950 text-slate-200 selection:bg-gold/30 selection:text-gold flex flex-col min-h-screen justify-between">

  <!-- Header -->
  <header class="w-full bg-transparent border-b border-white/5 py-5 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="font-serif text-xl font-bold tracking-widest text-gold">LAWAL<span class="text-xs tracking-normal text-slate-400 font-sans ml-1">.ORG</span></span>
      </a>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden">
    <div class="absolute w-[500px] h-[500px] bg-gold/5 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md text-center flex flex-col items-center gap-6 relative z-10 animate-fade-in">
      <div class="relative flex items-center justify-center w-24 h-24 mb-2">
        <!-- Golden concentric circles simulating traditional radar / heritage search -->
        <div class="absolute inset-0 rounded-full border border-gold/25 animate-ping duration-1000"></div>
        <div class="absolute inset-2 rounded-full border border-gold/10"></div>
        <span class="font-serif text-4xl font-bold text-gold tracking-widest relative z-10">404</span>
      </div>

      <div class="flex flex-col gap-2">
        <h2 class="text-2xl font-serif font-bold text-white tracking-wide">Path Not Traced</h2>
        <p class="text-xs text-slate-400 font-light leading-relaxed px-4">

        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
        <a href="dashboard.html" class="px-6 h-11 bg-gold text-slate-950 font-semibold tracking-wider uppercase text-xs rounded-xl flex items-center justify-center gap-2 hover:bg-gold-hover transition-colors shadow-lg shadow-gold/5">
          <i class="fa-solid fa-chart-line"></i> Dashboard Portal
        </a>
        <a href="index.html" class="px-6 h-11 border border-white/10 text-white font-semibold tracking-wider uppercase text-xs rounded-xl flex items-center justify-center gap-2 hover:border-white/30 transition-all">

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-white/5 py-6 text-center text-xs text-slate-500">
    &copy; 2024 Lawal.org. Private System Security.
  </footer>
