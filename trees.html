<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Trees | Lawal.org Private Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4AF37', hover: '#be992e', light: '#fdfbf2' },
            emerald: { DEFAULT: '#10B981', hover: '#059669' },
            slate: { 950: '#0B0F17' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 selection:bg-gold/30 selection:text-gold flex min-h-screen">

  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Layout wrapper -->
  <div class="flex-grow flex flex-col min-w-0 lg:pl-64">
    <!-- Shared Header Container -->
    <div id="header-container"></div>

    <!-- Family Trees Page Content -->
    <main class="flex-grow p-6 md:p-8 flex flex-col gap-8 max-w-7xl mx-auto w-full">

      <!-- Heritage Title Header Banner -->
      <div class="relative overflow-hidden rounded-3xl p-6 md:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-fade-in border border-white/5 select-none">
        <!-- Background Banner with LawalNG1.png -->
        <div class="absolute inset-0 z-0">
          <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-slate-950/20 z-10"></div>
          <img src="LawalNG1.png" alt="Lawal Family Heritage Backdrop" class="w-full h-full object-cover opacity-20" style="object-position: center 30%;">
        </div>

        <div class="relative z-10 flex flex-col gap-1 text-left">
          <span class="text-[9px] uppercase tracking-widest font-bold text-gold flex items-center gap-1.5"><i class="fa-solid fa-tree"></i> Multi-Tree Genealogy</span>
          <h1 class="font-serif text-2xl md:text-3xl font-bold text-white tracking-wide">Family Trees</h1>
          <p class="text-xs text-slate-300 font-light">Explore, connect, and manage multiple interconnected family lineages.</p>
        </div>

        <div class="relative z-10 flex gap-3"></div>
      </div>

      <!-- Family Trees Cards Grid -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8" id="trees-grid">
        <!-- Dynamic Tree Cards rendered via js/trees.js -->
        <div class="col-span-full text-center py-12">
          <i class="fa-solid fa-spinner animate-spin text-2xl text-gold"></i>
          <p class="text-xs text-slate-500 mt-2">Loading family trees...</p>
        </div>
      </section>

    </main>
  </div>

  <!-- Reusable navigation launcher modules -->
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/trees.js"></script>
</body>
</html>
