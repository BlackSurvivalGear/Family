<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Trees | Lawal.org Private Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4AF37', hover: '#be992e', light: '#fdfbf2' },
            emerald: { DEFAULT: '#10B981', hover: '#059669' },
            slate: { 950: '#0B0F17' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 selection:bg-gold/30 selection:text-gold flex min-h-screen">

  <!-- Shared Sidebar Container -->
  <div id="sidebar-container"></div>

  <!-- Main Content Layout wrapper -->
  <div class="flex-grow flex flex-col min-w-0 lg:pl-64">
    <!-- Shared Header Container -->
    <div id="header-container"></div>

    <!-- Family Trees Page Content -->
    <main class="flex-grow p-6 md:p-8 flex flex-col gap-8 max-w-7xl mx-auto w-full">

      <!-- Heritage Title Header Banner -->
      <div class="relative overflow-hidden rounded-3xl p-6 md:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4 animate-fade-in border border-white/5 select-none">
        <!-- Background Banner with LawalNG1.png -->
        <div class="absolute inset-0 z-0">
          <div class="absolute inset-0 bg-gradient-to-r from-slate-950 via-slate-950/80 to-slate-950/20 z-10"></div>
          <img src="LawalNG1.png" alt="Lawal Family Heritage Backdrop" class="w-full h-full object-cover opacity-20" style="object-position: center 30%;">
        </div>

        <div class="relative z-10 flex flex-col gap-1 text-left">
          <span class="text-[9px] uppercase tracking-widest font-bold text-gold flex items-center gap-1.5"><i class="fa-solid fa-tree"></i> Multi-Tree Genealogy</span>
          <h1 class="font-serif text-2xl md:text-3xl font-bold text-white tracking-wide">Family Trees</h1>
          <p class="text-xs text-slate-300 font-light">Explore, connect, and manage multiple interconnected family lineages.</p>
        </div>

        <div class="relative z-10 flex gap-3">
          <button id="create-tree-trigger-btn" class="hidden px-4 h-9 bg-emerald hover:bg-emerald-hover text-slate-950 font-bold tracking-wider text-xs rounded-xl flex items-center gap-1.5 transition-all shadow-md">
            <i class="fa-solid fa-plus text-[10px]"></i> Create New Tree
          </button>
        </div>
      </div>

      <!-- Family Trees Cards Grid -->
      <section class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8" id="trees-grid">
        <!-- Dynamic Tree Cards rendered via js/trees.js -->
        <div class="col-span-full text-center py-12">
          <i class="fa-solid fa-spinner animate-spin text-2xl text-gold"></i>
          <p class="text-xs text-slate-500 mt-2">Loading family trees...</p>
        </div>
      </section>

    </main>
  </div>

  <!-- CREATE TREE MODAL -->
  <div id="create-tree-modal" class="fixed inset-0 z-[100] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 transition-opacity opacity-0 pointer-events-none">
    <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fade-in">
      <div class="p-6 border-b border-white/5 flex justify-between items-center bg-slate-950/40">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-emerald/10 text-emerald flex items-center justify-center text-lg">
            <i class="fa-solid fa-folder-plus"></i>
          </div>
          <div>
            <h3 class="text-base font-serif font-bold text-white">Create New Tree</h3>
            <p class="text-[10px] text-slate-500">Add a new distinct lineage with customized visual style.</p>
          </div>
        </div>
        <button id="close-create-modal-btn" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="create-tree-form" class="p-6 flex flex-col gap-4 text-xs text-left">
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Tree Name</label>
          <input type="text" id="tree-name" required placeholder="e.g. Grimster" class="h-10 px-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Description</label>
          <textarea id="tree-description" rows="3" required placeholder="Description of this ancestral branch..." class="p-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white resize-none"></textarea>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Cover Image URL</label>
          <input type="url" id="tree-cover" required placeholder="https://..." class="h-10 px-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Theme Accent Color</label>
          <select id="tree-theme" required class="h-10 px-2 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white">
            <option value="gold">Gold (Default)</option>
            <option value="emerald">Emerald</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
          </select>
        </div>

        <div class="border-t border-white/5 pt-4 flex justify-end gap-2">
          <button type="button" id="create-cancel-btn" class="h-10 px-4 bg-white/5 hover:bg-white/10 text-white rounded-lg font-semibold tracking-wider uppercase text-[10px] transition-colors">Cancel</button>
          <button type="submit" class="h-10 px-6 bg-emerald text-slate-950 hover:bg-emerald-hover rounded-lg font-bold tracking-wider uppercase text-[10px] transition-colors">Create Tree</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EDIT TREE MODAL -->
  <div id="edit-tree-modal" class="fixed inset-0 z-[100] bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4 transition-opacity opacity-0 pointer-events-none">
    <div class="w-full max-w-md bg-slate-900 border border-white/10 rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] animate-fade-in">
      <div class="p-6 border-b border-white/5 flex justify-between items-center bg-slate-950/40">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-gold/10 text-gold flex items-center justify-center text-lg">
            <i class="fa-solid fa-pen-to-square"></i>
          </div>
          <div>
            <h3 class="text-base font-serif font-bold text-white">Edit Family Tree</h3>
            <p class="text-[10px] text-slate-500">Modify title, description, cover image, and theme accent colors.</p>
          </div>
        </div>
        <button id="close-edit-modal-btn" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="edit-tree-form" class="p-6 flex flex-col gap-4 text-xs text-left">
        <input type="hidden" id="edit-tree-id" />
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Tree Name</label>
          <input type="text" id="edit-tree-name" required placeholder="e.g. Grimster" class="h-10 px-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Description</label>
          <textarea id="edit-tree-description" rows="3" required placeholder="Description of this ancestral branch..." class="p-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white resize-none"></textarea>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Cover Image URL</label>
          <input type="url" id="edit-tree-cover" required placeholder="https://..." class="h-10 px-3 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white"/>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Theme Accent Color</label>
          <select id="edit-tree-theme" required class="h-10 px-2 rounded-lg bg-slate-950 border border-white/10 text-xs focus:outline-none focus:border-gold text-white">
            <option value="gold">Gold (Default)</option>
            <option value="emerald">Emerald</option>
            <option value="blue">Blue</option>
            <option value="purple">Purple</option>
          </select>
        </div>

        <div class="border-t border-white/5 pt-4 flex justify-between gap-2">
          <button type="button" id="delete-tree-btn" class="h-10 px-4 bg-red-600/10 hover:bg-red-600 border border-red-500/20 text-red-400 hover:text-white rounded-lg font-semibold tracking-wider uppercase text-[10px] transition-colors">Delete Tree</button>
          <div class="flex gap-2">
            <button type="button" id="edit-cancel-btn" class="h-10 px-4 bg-white/5 hover:bg-white/10 text-white rounded-lg font-semibold tracking-wider uppercase text-[10px] transition-colors">Cancel</button>
            <button type="submit" class="h-10 px-6 bg-gold text-slate-950 hover:bg-gold-hover rounded-lg font-bold tracking-wider uppercase text-[10px] transition-colors">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Reusable navigation launcher modules -->
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/trees.js"></script>
</body>
</html>
