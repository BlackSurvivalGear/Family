<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Lawal.org Private Portal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Global Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#D4AF37', hover: '#be992e' },
            emerald: { DEFAULT: '#10B981', hover: '#059669' },
            slate: { 950: '#0B0F17' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-200 selection:bg-gold/30 selection:text-gold flex flex-col min-h-screen">

  <header class="w-full bg-transparent border-b border-white/5 py-5 px-6">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <span class="font-serif text-xl font-bold tracking-widest text-gold">LAWAL<span class="text-xs tracking-normal text-slate-400 font-sans ml-1">.ORG</span></span>
      </a>
      <a href="signin.html" class="text-xs text-slate-400 hover:text-white transition-colors flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Back to Sign In
      </a>
    </div>
  </header>

  <!-- Forgot Password Main Section with LawalNG.png Background & tasteful dark overlay -->
  <main class="flex-grow flex items-center justify-center py-16 px-6 relative overflow-hidden bg-slate-950">
    <!-- LawalNG.png Heritage Backdrop -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
      <!-- Tasteful dark overlay (approx 80% opacity) behind forms to ensure text remains highly readable -->
      <div class="absolute inset-0 bg-gradient-to-b from-slate-950/90 via-slate-950/75 to-slate-950/90 z-10"></div>
      <img
        src="LawalNG1.png"
        alt="Lawal Heritage backdrop"
        class="w-full h-full object-cover opacity-25"
        style="object-position: center 30%;"
      />
    </div>

    <div class="w-full max-w-md relative z-10">
      <div class="glass-panel border border-white/10 p-8 rounded-3xl shadow-2xl flex flex-col gap-6 animate-fade-in" id="forgot-card">

        <div class="text-center">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gold/10 text-gold mb-3">
            <i class="fa-solid fa-envelope-open-text text-xl"></i>
          </div>
          <h2 class="text-2xl font-serif font-bold text-white tracking-wide">Recover Password</h2>
          <p class="text-xs text-slate-400 font-light mt-1">Provide your verified relative email address to dispatch password recovery links.</p>
        </div>

        <form id="forgot-form" class="flex flex-col gap-4">
          <div class="flex flex-col gap-1.5">
            <label for="email" class="text-xs font-semibold tracking-wider text-slate-300 uppercase">Email Address</label>
            <input
              type="email"
              id="email"
              required
              placeholder="relative@lawal.org"
              class="w-full h-11 px-4 rounded-xl bg-slate-900/80 border border-white/10 text-sm focus:outline-none focus:border-gold/50 focus:ring-1 focus:ring-gold/30 transition-all text-slate-200"
            />
          </div>

          <button
            type="submit"
            class="w-full h-11 bg-gradient-to-r from-gold to-gold-hover hover:scale-[1.01] active:scale-100 text-slate-950 font-semibold tracking-wider uppercase text-xs rounded-xl transition-all shadow-md shadow-gold/10 mt-2"
          >
            Dispatch Link <i class="fa-solid fa-paper-plane ml-1"></i>
          </button>
        </form>

        <div class="text-center text-xs text-slate-400 border-t border-white/5 pt-4">
          Remembered security credentials? <a href="signin.html" class="text-gold font-medium hover:underline">Sign In here</a>
        </div>

      </div>
    </div>
  </main>

  <footer class="bg-slate-950 border-t border-white/5 py-4 text-center text-xs text-slate-500">
    &copy; 2024 Lawal.org. Private Security Framework.
  </footer>

  <script type="module">
    import { DB } from './js/db.js';
    import { app, auth, db } from './js/firebase/firebase.js';

    DB.init();

    const form = document.getElementById('forgot-form');
    const forgotCard = document.getElementById('forgot-card');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();

      // Change forgot-card contents with animation to show success
      forgotCard.style.opacity = 0;
      setTimeout(() => {
        forgotCard.innerHTML = `
          <div class="text-center flex flex-col gap-4 py-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald/10 text-emerald mb-2 mx-auto">
              <i class="fa-solid fa-check-double text-2xl"></i>
            </div>
            <h2 class="text-2xl font-serif font-bold text-white tracking-wide">Link Dispatched</h2>
            <p class="text-xs text-slate-400 font-light leading-relaxed">
              We have successfully dispatched password recovery instructions to: <br>
              <strong class="text-gold font-semibold">${email}</strong>.
            </p>
            <div class="border-t border-white/5 my-3"></div>
            <a href="signin.html" class="inline-flex items-center justify-center h-11 px-6 bg-gold text-slate-950 font-semibold tracking-wider uppercase text-xs rounded-xl hover:bg-gold-hover transition-colors">
              Return to Sign In
            </a>
          </div>
        `;
        forgotCard.style.opacity = 1;
      }, 300);
    });
  </script>
</body>
</html>
